<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#07070a"/>
      <stop offset="100%" stop-color="#020203"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0%"  stop-color="#c96a1e" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#c96a1e" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#c96a1e" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#fff3cf"/>
      <stop offset="30%" stop-color="#f0c46a"/>
      <stop offset="55%" stop-color="#c98a2e"/>
      <stop offset="80%" stop-color="#8a5416"/>
      <stop offset="100%" stop-color="#5c360c"/>
    </linearGradient>

    <linearGradient id="deckBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#232227"/>
      <stop offset="100%" stop-color="#111013"/>
    </linearGradient>

    <linearGradient id="screenBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#050506"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <filter id="titleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1400" height="560" fill="url(#bg)"/>
  <ellipse cx="700" cy="330" rx="620" ry="300" fill="url(#glow)"/>

  <!-- title -->
  <text x="700" y="115" text-anchor="middle"
        font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif"
        font-size="96" font-weight="700" letter-spacing="16"
        fill="url(#gold)" stroke="#2a1204" stroke-width="2"
        filter="url(#titleShadow)">SKRIM</text>
  <text x="700" y="150" text-anchor="middle"
        font-family="Cinzel, Georgia, 'Times New Roman', serif"
        font-size="19" letter-spacing="7"
        fill="#f0d9a8" opacity="0.85">MOD YOUR SKYRIM &#8226; STEAM DECK BORN</text>

  <!-- steam deck -->
  <g transform="translate(700,365)" filter="url(#softShadow)">

    <!-- body: screen slab flanked by grips -->
    <path fill="url(#deckBody)" d="
      M -430,-40
      C -430,-78 -400,-108 -362,-110
      L -300,-112
      C -290,-140 -262,-160 -230,-160
      L 230,-160
      C 262,-160 290,-140 300,-112
      L 362,-110
      C 400,-108 430,-78 430,-40
      L 430,10
      C 430,60 400,102 356,120
      C 316,136 274,124 250,90
      L 236,68
      C 220,44 -220,44 -236,68
      L -250,90
      C -274,124 -316,136 -356,120
      C -400,102 -430,60 -430,10
      Z"/>

    <!-- top shoulder buttons -->
    <rect x="-352" y="-150" width="70" height="16" rx="8" fill="#000000"/>
    <rect x="282" y="-150" width="70" height="16" rx="8" fill="#000000"/>

    <!-- left grip controls -->
    <circle cx="-352" cy="-60" r="30" fill="#000000"/>
    <circle cx="-352" cy="-60" r="30" fill="none" stroke="#3a3a40" stroke-width="2"/>
    <circle cx="-352" cy="-60" r="12" fill="#232227"/>
    <g stroke="#3a3a40" stroke-width="6" stroke-linecap="round">
      <line x1="-380" y1="20" x2="-352" y2="20"/>
      <line x1="-366" y1="6" x2="-366" y2="34"/>
    </g>
    <circle cx="-352" cy="80" r="46" fill="#000000"/>
    <circle cx="-352" cy="80" r="46" fill="none" stroke="#3a3a40" stroke-width="2"/>

    <!-- right grip controls -->
    <circle cx="352" cy="-60" r="30" fill="#000000"/>
    <circle cx="352" cy="-60" r="30" fill="none" stroke="#3a3a40" stroke-width="2"/>
    <circle cx="352" cy="-60" r="12" fill="#232227"/>
    <g fill="#3a3a40">
      <circle cx="366" cy="6" r="6"/>
      <circle cx="338" cy="6" r="6"/>
      <circle cx="352" cy="-8" r="6"/>
      <circle cx="352" cy="20" r="6"/>
    </g>
    <circle cx="352" cy="80" r="46" fill="#000000"/>
    <circle cx="352" cy="80" r="46" fill="none" stroke="#3a3a40" stroke-width="2"/>

    <!-- screen bezel -->
    <rect x="-260" y="-142" width="520" height="300" rx="18" fill="url(#screenBezel)"/>

    <!-- konsole window -->
    <g transform="translate(-236,-118)">
      <rect x="0" y="0" width="472" height="250" rx="6" fill="#1b1d1e"/>
      <!-- titlebar -->
      <rect x="0" y="0" width="472" height="26" rx="6" fill="#2a2e30"/>
      <rect x="0" y="18" width="472" height="8" fill="#2a2e30"/>
      <circle cx="18" cy="13" r="6" fill="#57c7ff"/>
      <text x="236" y="18" text-anchor="middle" font-family="Sans" font-size="12" fill="#9aa0a4">konsole</text>
      <circle cx="436" cy="13" r="6" fill="#4a4f52"/>
      <circle cx="454" cy="13" r="6" fill="#4a4f52"/>

      <!-- terminal body -->
      <g font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="13.5">
        <text x="14" y="50"  fill="#8be9a1">deck@steamdeck</text>
        <text x="140" y="50" fill="#e6e6e6">skyrim-mods $ skrim -c mods.conf</text>

        <text x="14" y="74"  fill="#7fb3ff">INFO:</text>
        <text x="66" y="74"  fill="#c8ccd0">loaded 5 mod(s) from mods.conf</text>

        <text x="14" y="96"  fill="#7fb3ff">INFO:</text>
        <text x="66" y="96"  fill="#c8ccd0">installing [skse64] (1/5)</text>

        <text x="14" y="118" fill="#7fb3ff">INFO:</text>
        <text x="66" y="118" fill="#c8ccd0">installing [address_library] (2/5)</text>

        <text x="14" y="140" fill="#7fb3ff">INFO:</text>
        <text x="66" y="140" fill="#c8ccd0">installing [skyui] (3/5)</text>

        <text x="14" y="162" fill="#7fb3ff">INFO:</text>
        <text x="66" y="162" fill="#c8ccd0">installing [ordinator] (4/5)</text>

        <text x="14" y="184" fill="#7fb3ff">INFO:</text>
        <text x="66" y="184" fill="#c8ccd0">installing [realistic_ragdolls] (5/5)</text>

        <text x="14" y="208" fill="#8be9a1">deck@steamdeck</text>
        <text x="140" y="208" fill="#e6e6e6">skyrim-mods $</text>
        <rect x="270" y="197" width="10" height="16" fill="#d8d8d8" opacity="0.9"/>
      </g>
    </g>
  </g>
</svg>
