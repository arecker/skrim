<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" width="1400" height="560">
  <defs>
    <linearGradient id="deckBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#232227"/>
      <stop offset="100%" stop-color="#111013"/>
    </linearGradient>

    <linearGradient id="screenBezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#050506"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- backdrop -->
  <rect x="0" y="0" width="1400" height="560" fill="#ffffff"/>

  <!-- title -->
  <text x="700" y="115" text-anchor="middle"
        font-family="Monaco, 'JetBrains Mono', 'DejaVu Sans Mono', 'Courier New', monospace"
        font-size="92" font-weight="700" letter-spacing="4"
        fill="#000000">skrim</text>
  <text x="700" y="150" text-anchor="middle"
        font-family="Cinzel, Georgia, 'Times New Roman', serif"
        font-size="19" letter-spacing="7"
        fill="#000000" opacity="0.8">MOD YOUR SKYRIM &#8226; STEAM DECK BORN</text>

  <!-- steam deck (shape based on a real product photo of the device) -->
  <g transform="translate(700,365)" filter="url(#softShadow)">

    <!-- body: screen slab flanked by tapered grip handles -->
    <path fill="url(#deckBody)" d="
      M -270,-145
      C -270,-158 -280,-166 -294,-167
      L -382,-172
      C -414,-174 -440,-150 -444,-118
      C -448,-80 -450,-20 -448,60
      C -446,110 -440,150 -414,172
      C -392,190 -360,192 -336,183
      C -312,177 -285,174 -270,170
      L -270,-145 Z
      M 270,-145
      C 270,-158 280,-166 294,-167
      L 382,-172
      C 414,-174 440,-150 444,-118
      C 448,-80 450,-20 448,60
      C 446,110 440,150 414,172
      C 392,190 360,192 336,183
      C 312,177 285,174 270,170
      L 270,-145 Z
      M -294,-167 L 294,-167 C 280,-166 270,-158 270,-145 L 270,170 L -270,170 L -270,-145 C -270,-158 -280,-166 -294,-167 Z"/>

    <!-- accent seam across each grip -->
    <g fill="none" stroke="#050506" stroke-width="3" stroke-linecap="round" opacity="0.8">
      <path d="M -430,-6 C -400,2 -350,4 -300,-4"/>
      <path d="M 430,-6 C 400,2 350,4 300,-4"/>
    </g>

    <!-- shoulder button hints, top outer corners -->
    <rect x="-410" y="-174" width="56" height="12" rx="6" fill="#000000"/>
    <rect x="354" y="-174" width="56" height="12" rx="6" fill="#000000"/>

    <!-- small top-inner buttons (capture / quick-access) -->
    <rect x="-318" y="-160" width="26" height="16" rx="4" fill="#000000"/>
    <g fill="none" stroke="#45454c" stroke-width="2.5" stroke-linecap="round">
      <line x1="292" y1="-157" x2="312" y2="-157"/>
      <line x1="292" y1="-151" x2="312" y2="-151"/>
      <line x1="292" y1="-145" x2="312" y2="-145"/>
    </g>

    <!-- left grip: d-pad (outboard) + thumbstick (inboard) -->
    <g stroke="#4a4a52" stroke-width="7" stroke-linecap="round">
      <line x1="-410" y1="-56" x2="-382" y2="-56"/>
      <line x1="-396" y1="-70" x2="-396" y2="-42"/>
    </g>
    <circle cx="-330" cy="-56" r="26" fill="#000000"/>
    <circle cx="-330" cy="-56" r="26" fill="none" stroke="#45454c" stroke-width="2"/>
    <circle cx="-330" cy="-56" r="10" fill="#2c2c32"/>

    <!-- right grip: thumbstick (inboard) + ABXY (outboard) -->
    <circle cx="330" cy="-56" r="26" fill="#000000"/>
    <circle cx="330" cy="-56" r="26" fill="none" stroke="#45454c" stroke-width="2"/>
    <circle cx="330" cy="-56" r="10" fill="#2c2c32"/>
    <g fill="none" stroke="#4a4a52" stroke-width="2.5">
      <circle cx="410" cy="-40" r="9"/>
      <circle cx="382" cy="-40" r="9"/>
      <circle cx="396" cy="-54" r="9"/>
      <circle cx="396" cy="-26" r="9"/>
    </g>

    <!-- trackpads -->
    <rect x="-408" y="4" width="96" height="96" rx="20" fill="#0a0a0c"/>
    <rect x="-408" y="4" width="96" height="96" rx="20" fill="none" stroke="#3a3a40" stroke-width="2"/>
    <rect x="312" y="4" width="96" height="96" rx="20" fill="#0a0a0c"/>
    <rect x="312" y="4" width="96" height="96" rx="20" fill="none" stroke="#3a3a40" stroke-width="2"/>

    <!-- steam / quick-access pill buttons -->
    <rect x="-388" y="118" width="56" height="20" rx="10" fill="#000000"/>
    <rect x="-388" y="118" width="56" height="20" rx="10" fill="none" stroke="#3a3a40" stroke-width="1.5"/>
    <rect x="332" y="118" width="56" height="20" rx="10" fill="#000000"/>
    <g fill="#5a5a62">
      <circle cx="352" cy="128" r="3"/><circle cx="360" cy="128" r="3"/><circle cx="368" cy="128" r="3"/>
    </g>

    <!-- speaker grilles, tucked near the inner-bottom screen corners -->
    <g fill="#000000" opacity="0.55">
      <circle cx="-308" cy="150" r="2.4"/><circle cx="-300" cy="153" r="2.4"/><circle cx="-292" cy="156" r="2.4"/>
      <circle cx="-308" cy="160" r="2.4"/><circle cx="-300" cy="163" r="2.4"/><circle cx="-292" cy="166" r="2.4"/>
      <circle cx="308" cy="150" r="2.4"/><circle cx="300" cy="153" r="2.4"/><circle cx="292" cy="156" r="2.4"/>
      <circle cx="308" cy="160" r="2.4"/><circle cx="300" cy="163" r="2.4"/><circle cx="292" cy="166" r="2.4"/>
    </g>

    <!-- screen bezel -->
    <rect x="-262" y="-140" width="524" height="285" rx="14" fill="url(#screenBezel)"/>

    <!-- konsole window -->
    <g transform="translate(-236,-118)">
      <rect x="0" y="0" width="472" height="250" rx="6" fill="#1b1d1e"/>
      <!-- titlebar -->
      <rect x="0" y="0" width="472" height="26" rx="6" fill="#2a2e30"/>
      <rect x="0" y="18" width="472" height="8" fill="#2a2e30"/>
      <circle cx="18" cy="13" r="6" fill="#57c7ff"/>
      <text x="236" y="18" text-anchor="middle" font-family="Sans" font-size="12" fill="#9aa0a4">konsole</text>
      <circle cx="436" cy="13" r="6" fill="#4a4f52"/>
      <circle cx="454" cy="13" r="6" fill="#4a4f52"/>

      <!-- terminal body -->
      <g font-family="'DejaVu Sans Mono','Courier New',monospace" font-size="13.5">
        <text x="14" y="50"  fill="#8be9a1">deck@steamdeck</text>
        <text x="140" y="50" fill="#e6e6e6">skyrim-mods $ skrim -c mods.conf</text>

        <text x="14" y="74"  fill="#7fb3ff">INFO:</text>
        <text x="66" y="74"  fill="#c8ccd0">loaded 5 mod(s) from mods.conf</text>

        <text x="14" y="96"  fill="#7fb3ff">INFO:</text>
        <text x="66" y="96"  fill="#c8ccd0">installing [skse64] (1/5)</text>

        <text x="14" y="118" fill="#7fb3ff">INFO:</text>
        <text x="66" y="118" fill="#c8ccd0">installing [address_library] (2/5)</text>

        <text x="14" y="140" fill="#7fb3ff">INFO:</text>
        <text x="66" y="140" fill="#c8ccd0">installing [skyui] (3/5)</text>

        <text x="14" y="162" fill="#7fb3ff">INFO:</text>
        <text x="66" y="162" fill="#c8ccd0">installing [ordinator] (4/5)</text>

        <text x="14" y="184" fill="#7fb3ff">INFO:</text>
        <text x="66" y="184" fill="#c8ccd0">installing [realistic_ragdolls] (5/5)</text>

        <text x="14" y="208" fill="#8be9a1">deck@steamdeck</text>
        <text x="140" y="208" fill="#e6e6e6">skyrim-mods $</text>
        <rect x="270" y="197" width="10" height="16" fill="#d8d8d8" opacity="0.9"/>
      </g>
    </g>
  </g>
</svg>
